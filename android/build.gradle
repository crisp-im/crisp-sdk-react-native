plugins {
  id 'expo-module-gradle-plugin'
}

def packageJson = new groovy.json.JsonSlurper().parse(file('../package.json'))

group = 'expo.modules.crispsdk'
version = packageJson.version

android {
  namespace "expo.modules.crispsdk"
  defaultConfig {
    versionCode 1
    versionName packageJson.version
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // api: the notification service generated by the config plugin (coexistence mode) lives in the app module
  api "im.crisp:crisp-sdk:3.0.0beta2"
  implementation "com.google.android.material:material:1.14.0"

  // Notifications are optional in Crisp Android 3.x: the app provides Firebase Messaging
  // (the config plugin adds it when notifications are enabled).
  compileOnly platform("com.google.firebase:firebase-bom:34.18.0")
  compileOnly "com.google.firebase:firebase-messaging"

  testImplementation "junit:junit:4.13.2"
}
