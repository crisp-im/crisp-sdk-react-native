on: [push, pull_request]

name: Test and Build

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NONINTERACTIVE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          # The packaging script needs npm 11.19.1, bundled with the latest Node 24 only
          check-latest: true
          registry-url: https://registry.npmjs.org

      - name: Verify versions
        run: node --version && npm --version && node -p process.versions.v8

      - name: Enable Corepack
        run: corepack enable && corepack prepare yarn@4.7.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate and pack candidate (no publication)
        run: yarn release:prepare --out-dir "$RUNNER_TEMP/crisp-candidate"

      - name: Upload inspected candidate
        uses: actions/upload-artifact@v4
        with:
          name: crisp-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/crisp-candidate/*.tgz
            ${{ runner.temp }}/crisp-candidate/candidate.json
          if-no-files-found: error
          retention-days: 7
